services:
  backend:
    build: .
    ports:
      - "6767:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    volumes:
      - ./src:/app/src
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - racha-se-network

  db:
    image: postgres:17-alpine
    ports:
      - "6969:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - racha-se-network

  adminer:
    image: adminer
    ports:
      - "6769:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - racha-se-network

  mailpit:
    image: axllent/mailpit
    ports:
      - "6825:1025" # SMTP — point SMTP_HOST/SMTP_PORT here when running `bun run dev` on the host
      - "6826:8025" # web UI — view caught emails at http://localhost:6826
    networks:
      - racha-se-network

networks:
  racha-se-network:
    name: racha-se-network
    driver: bridge

volumes:
  db-data:
