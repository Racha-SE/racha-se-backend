name: Push OpenAPI document to the Registry

on:
  push:
    branches:
      - main

jobs:
  push-to-scalar-registry:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      DATABASE_URL: postgres://nobody:nobody@localhost:1/unreachable
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-unused-outside-this-job
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate OpenAPI document from the running app
        run: |
          bun run src/index.ts &
          SERVER_PID=$!
          for i in $(seq 1 10); do
            curl -sf http://localhost:3000/v1/health && break
            sleep 1
          done
          mkdir -p api
          curl -sf http://localhost:3000/openapi/json -o api/openapi.json
          kill "$SERVER_PID"

      - name: Normalize schema for OpenAPI 3.0 (const -> enum)
        run: |
          jq 'walk(if type == "object" and has("const") then . + {enum: [.const]} | del(.const) else . end)' api/openapi.json > api/openapi.normalized.json
          mv api/openapi.normalized.json api/openapi.json

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate OpenAPI Document
        run: npx @scalar/cli document validate api/openapi.json

      - name: Log in to Registry
        run: npx @scalar/cli auth login --token ${{ secrets.SCALAR_API_KEY }}

      - name: Push to Registry
        run: npx @scalar/cli registry publish --namespace default-team-dt2lv --slug racha-se-backend api/openapi.json
